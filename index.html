                                                <div className="flex items-center justify-between text-slate-500 font-medium pt-0.5 border-t border-[#eef4e6]">
                                                    <span>⚪ รอดำเนินการ:</span>
                                                    <span>{summary.pendingQty} ชิ้น</span>
                                                </div>
                                            )}
                                        </div>

                                        {/* Summary Box */}
                                        <div className="bg-[#fafdf7] border border-[#e2ecd5] rounded-2xl overflow-hidden">
                                            <div className="px-4 py-2 flex items-center justify-between border-b border-[#e2ecd5]">
                                                <span className="font-semibold text-[#7a6b52] text-xs flex items-center gap-1.5">
                                                    🧺 สินค้าทั้งหมด
                                                </span>
                                                <span className="font-bold text-[#4a3b2c] text-sm">{activeOrder.totalQty} ชิ้น</span>
                                            </div>
                                            <div className="px-4 py-2 bg-[#f3f9eb] flex items-center justify-between">
                                                <span className="font-bold text-[#4a3b2c] text-base">ยอดรวม</span>
                                                <span className="font-extrabold text-[#e55b69] text-xl">฿{activeOrder.totalPrice}</span>
                                            </div>
                                        </div>

                                        {/* Manage Order (Go to Admin Backoffice) */}
                                        <button
                                            onClick={() => {
                                                setAdminTab('orders');
                                                setScreen('admin');
                                            }}
                                            className="w-full btn-pink-3d py-3 text-lg font-bold flex items-center justify-center gap-2"
                                        >
                                            <span>⚙️ จัดการคำสั่งซื้อ</span>
                                        </button>
                                    </div>
                                </div>

                                <HayDayFooterFence />
                            </div>
                        );
                    })()}

                    {/* ==========================================
                        SCREEN 6: ADMIN BACKOFFICE (4 Organized Tabs: Orders Tap-to-Cycle, Products, Categories, Branding/PNGs)
                       ========================================== */}
                    {screen === 'admin' && (
                        <div className="flex flex-col flex-1">
                            <div className="content-container max-w-3xl">
                                <HayDayPastelHeader mode="sub" storeName={branding.storeName} bannerUrl={branding.bannerUrl} />
                            </div>

                            <div className="content-container max-w-3xl px-4 space-y-3 flex-1 pb-10">
                                {/* Top Nav */}
                                <div className="nav-pill px-3 py-2 flex items-center justify-between">
                                    <button
                                        onClick={() => setScreen('store')}
                                        className="w-8 h-8 rounded-full bg-[#68b43c] text-white flex items-center justify-center font-bold text-base shadow-sm"
                                    >
                                        ❮
                                    </button>
                                    <h2 className="text-[#4a3b2c] font-extrabold text-base md:text-lg">⚙️ ระบบหลังบ้าน (Admin Demo)</h2>
                                    <div className="w-8"></div>
                                </div>

                                {/* Demo Disclaimer */}
                                <div className="bg-amber-50 border border-amber-200 rounded-2xl p-2.5 text-[11px] text-amber-900">
                                    <strong>📌 โหมดทดลองใช้งาน (Demo):</strong> ข้อมูลทั้งหมดทำงานในหน่วยความจำชั่วคราวของหน้าเว็บ (ยังไม่ได้เชื่อมฐานข้อมูลจริง) แยกข้อมูลตัวอย่างออกจากออเดอร์ใหม่ชัดเจน
                                </div>

                                {/* 4 Organized Backoffice Tabs */}
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                    {[
                                        { id: 'orders', label: '📦 ออเดอร์ลูกค้า' },
                                        { id: 'products', label: '🌾 จัดการสินค้า' },
                                        { id: 'categories', label: '🗂️ หมวดหมู่' },
                                        { id: 'branding', label: '🎨 โลโก้ & รูป PNG' },
                                    ].map(t => (
                                        <button
                                            key={t.id}
                                            onClick={() => setAdminTab(t.id)}
                                            className={`py-2 px-3 rounded-2xl text-xs font-bold border transition-all ${
                                                adminTab === t.id
                                                    ? 'bg-[#68b43c] text-white border-[#86cf58] shadow-sm'
                                                    : 'bg-white text-[#556b2f] border-[#dce8ce] hover:bg-[#f7fbf2]'
                                            }`}
                                        >
                                            {t.label}
                                        </button>
                                    ))}
                                </div>

                                {/* TAB 1: CUSTOMER ORDERS (Tap product card: 1x Green Sent, 2x Yellow Waiting, 3x Red Out of Stock) */}
                                {adminTab === 'orders' && (
                                    <div className="space-y-3">
                                        {orders.length === 0 ? (
                                            <div className="card-pastel p-8 text-center text-xs font-bold text-[#7a6b52]">
                                                ไม่มีรายการออเดอร์ในขณะนี้
                                            </div>
                                        ) : orders.map(order => {
                                            const summary = getOrderFulfillmentSummary(order.items);
                                            return (
                                                <div key={order.code} className="card-pastel p-4 space-y-3">
                                                    <div className="flex items-center justify-between flex-wrap gap-2">
                                                        <div className="flex items-center gap-2">
                                                            <span className="font-black text-lg text-[#4a3b2c]">{order.code}</span>
                                                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${order.isDemoSample ? 'bg-amber-100 text-amber-800' : 'bg-green-100 text-green-800'}`}>
                                                                {order.isDemoSample ? 'ข้อมูลตัวอย่าง' : 'ออเดอร์ใหม่'}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <span className="text-xs font-bold bg-[#f4fae9] text-[#556b2f] px-2.5 py-1 rounded-full border border-[#dce8ce]">
                                                                🏷️ {order.tag}
                                                            </span>
                                                            <span className="font-extrabold text-lg text-[#e55b69]">฿{order.totalPrice}</span>
                                                            <button
                                                                onClick={() => handleDeleteOrder(order.code)}
                                                                className="px-2.5 py-1 rounded-full bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 text-xs font-bold active:scale-95 transition"
                                                                title="ลบออเดอร์นี้"
                                                            >
                                                                🗑️ ลบ
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {/* Tappable Small Rounded Square Product Cards */}
                                                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2.5">
                                                        {order.items.map(item => {
                                                            const st = item.itemStatus || 'pending';
                                                            const cardStyle =
                                                                st === 'sent'
                                                                    ? 'bg-emerald-100/90 border-emerald-500 ring-2 ring-emerald-300/60'
                                                                    : st === 'waiting'
                                                                    ? 'bg-amber-100/90 border-amber-400 ring-2 ring-amber-300/60'
                                                                    : st === 'out'
                                                                    ? 'bg-rose-100/90 border-rose-500 ring-2 ring-rose-300/60'
                                                                    : 'bg-[#fafdf7] border-[#dce8ce] hover:border-[#86cf58]';

                                                            const badgeInfo =
                                                                st === 'sent'
                                                                    ? { label: 'ส่งแล้ว', cls: 'bg-emerald-600 text-white' }
                                                                    : st === 'waiting'
                                                                    ? { label: 'รอรับของ', cls: 'bg-amber-400 text-amber-950' }
                                                                    : st === 'out'
                                                                    ? { label: 'ของหมด', cls: 'bg-rose-600 text-white' }
                                                                    : { label: 'จิ้มเปลี่ยนสถานะ', cls: 'bg-slate-200 text-slate-700' };

                                                            return (
                                                                <button
                                                                    key={item.id}
                                                                    type="button"
                                                                    onClick={() => cycleOrderItemStatus(order.code, item.id)}
                                                                    className={`relative rounded-2xl border p-2 flex flex-col items-center text-center transition-all active:scale-95 cursor-pointer ${cardStyle}`}
                                                                >
                                                                    {/* Quantity in Top-Right Corner */}
                                                                    <div className="absolute -top-1.5 -right-1.5 bg-[#4a3b2c] text-white text-[11px] font-extrabold px-2 py-0.5 rounded-full shadow border border-white z-10">
                                                                        ×{item.qty}
                                                                    </div>

                                                                    <div className="w-14 h-14 aspect-square flex items-center justify-center p-1">
                                                                        <ItemIllustration type={item.svgType} imageUrl={item.imageUrl} size="w-full h-full object-contain" />
                                                                    </div>

                                                                    <div className="font-bold text-[#4a3b2c] text-[11px] leading-tight line-clamp-1 mt-0.5">
                                                                        {item.name}
                                                                    </div>
                                                                    <span className={`mt-1 text-[9px] font-bold px-2 py-0.5 rounded-full ${badgeInfo.cls}`}>
                                                                        {badgeInfo.label}
                                                                    </span>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>

                                                    {/* Detailed Itemized Summary Below Order */}
                                                    <div className="bg-[#fafdf7] border border-[#e2ecd5] rounded-2xl p-3 space-y-1.5 text-xs">
                                                        <div className="flex items-start justify-between gap-2 text-emerald-700 font-semibold">
                                                            <span>🟢 ส่งแล้ว ({summary.sentQty} ชิ้น):</span>
                                                            <span className="text-right">{summary.sentList.length > 0 ? summary.sentList.join(', ') : 'ยังไม่มี'}</span>
                                                        </div>
                                                        <div className="flex items-start justify-between gap-2 text-amber-700 font-semibold">
                                                            <span>🟡 รอส่ง / รอลูกค้ารับ ({summary.waitingQty + summary.pendingQty} ชิ้น):</span>
                                                            <span className="text-right">
                                                                {[...summary.waitingList, ...order.items.filter(i => !i.itemStatus || i.itemStatus === 'pending').map(i => `${i.name} ×${i.qty}`)].join(', ') || 'ไม่มี'}
                                                            </span>
                                                        </div>
                                                        <div className="flex items-start justify-between gap-2 text-rose-700 font-semibold">
                                                            <span>🔴 ของหมด ({summary.outQty} ชิ้น):</span>
                                                            <span className="text-right">{summary.outList.length > 0 ? summary.outList.join(', ') : 'ไม่มี'}</span>
                                                        </div>
                                                    </div>

                                                    <button
                                                        onClick={() => {
                                                            setActiveOrderCode(order.code);
                                                            setScreen('details');
                                                        }}
                                                        className="w-full py-2 rounded-xl bg-[#eef8e3] text-[#4b7c22] font-bold text-xs hover:bg-[#e1f2ce]"
                                                    >
                                                        🔍 ดูหน้ามุมมองลูกค้าของออเดอร์นี้
                                                    </button>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {/* TAB 2: MANAGE PRODUCTS */}
                                {adminTab === 'products' && (
                                    <div className="space-y-3">
                                        <form onSubmit={handleSaveProduct} className="card-pastel p-4 space-y-2.5">
                                            <h3 className="font-bold text-[#4a3b2c] text-sm">
                                                {editingProdId ? '✏️ แก้ไขข้อมูลสินค้า' : '➕ เพิ่มสินค้าใหม่'}
                                            </h3>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                <input
                                                    type="text"
                                                    required
                                                    value={newProdForm.name}
                                                    onChange={e => setNewProdForm({ ...newProdForm, name: e.target.value })}
                                                    placeholder="ชื่อสินค้า (เช่น ขวาน, เลื่อย)"
                                                    className="bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-3 py-2 text-xs font-medium outline-none"
                                                />
                                                <input
                                                    type="text"
                                                    value={newProdForm.desc}
                                                    onChange={e => setNewProdForm({ ...newProdForm, desc: e.target.value })}
                                                    placeholder="คำอธิบายสั้นๆ"
                                                    className="bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-3 py-2 text-xs font-medium outline-none"
                                                />
                                                <div className="grid grid-cols-3 gap-2">
                                                    <input
                                                        type="number"
                                                        min="1"
                                                        value={newProdForm.level}
                                                        onChange={e => setNewProdForm({ ...newProdForm, level: e.target.value })}
                                                        placeholder="เลเวล"
                                                        className="bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-2.5 py-2 text-xs font-bold outline-none"
                                                    />
                                                    <input
                                                        type="number"
                                                        min="0"
                                                        value={newProdForm.price}
                                                        onChange={e => setNewProdForm({ ...newProdForm, price: e.target.value })}
                                                        placeholder="ราคา (฿)"
                                                        className="bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-2.5 py-2 text-xs font-bold outline-none"
                                                    />
                                                    <select
                                                        value={newProdForm.category}
                                                        onChange={e => setNewProdForm({ ...newProdForm, category: e.target.value })}
                                                        className="bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-2 py-2 text-xs font-bold outline-none"
                                                    >
                                                        {categories.filter(c => c.id !== 'ทั้งหมด').map(c => (
                                                            <option key={c.id} value={c.id}>{c.label}</option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <input
                                                    type="url"
                                                    value={newProdForm.imageUrl}
                                                    onChange={e => setNewProdForm({ ...newProdForm, imageUrl: e.target.value })}
                                                    placeholder="ลิงก์รูปสินค้า 1:1 (เว้นว่างเพื่อใช้รูปวาดเดิม)"
                                                    className="bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-3 py-2 text-xs font-medium outline-none"
                                                />
                                            </div>
                                            <div className="flex gap-2">
                                                <button type="submit" className="btn-pink-3d px-5 py-2 text-xs font-bold">
                                                    {editingProdId ? '💾 บันทึกการแก้ไข' : '➕ เพิ่มสินค้า'}
                                                </button>
                                                {editingProdId && (
                                                    <button
                                                        type="button"
                                                        onClick={() => {
                                                            setEditingProdId(null);
                                                            setNewProdForm({ name: '', desc: '', level: 7, price: 5, category: 'โรงนา', svgType: 'plank', imageUrl: '' });
                                                        }}
                                                        className="px-4 py-2 rounded-full bg-slate-100 text-slate-600 text-xs font-bold"
                                                    >
                                                        ยกเลิก
                                                    </button>
                                                )}
                                            </div>
                                        </form>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                            {products.map(p => (
                                                <div key={p.id} className="card-pastel p-3 flex items-center justify-between gap-2">
                                                    <div className="flex items-center gap-2.5">
                                                        <div className="w-12 h-12 aspect-square bg-[#f7fbf2] rounded-xl border border-[#e3eed6] flex items-center justify-center p-1">
                                                            <ItemIllustration type={p.svgType} imageUrl={p.imageUrl} size="w-full h-full object-contain" />
                                                        </div>
                                                        <div>
                                                            <div className="font-bold text-[#4a3b2c] text-xs">{p.name} <span className="text-[#68b43c]">(เวล {p.level})</span></div>
                                                            <div className="text-[11px] text-[#7a6b52]">{p.category} • <strong className="text-[#e55b69]">฿{p.price}</strong></div>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-1">
                                                        <button
                                                            onClick={() => {
                                                                setEditingProdId(p.id);
                                                                setNewProdForm({ name: p.name, desc: p.desc, level: p.level, price: p.price, category: p.category, svgType: p.svgType, imageUrl: p.imageUrl || '' });
                                                            }}
                                                            className="px-2.5 py-1 rounded-lg bg-[#eef8e3] text-[#4b7c22] text-[11px] font-bold"
                                                        >
                                                            แก้ไข
                                                        </button>
                                                        <button
                                                            onClick={() => handleDeleteProduct(p.id)}
                                                            className="px-2.5 py-1 rounded-lg bg-rose-50 text-rose-600 text-[11px] font-bold"
                                                        >
                                                            ลบ
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* TAB 3: MANAGE CATEGORIES */}
                                {adminTab === 'categories' && (
                                    <div className="card-pastel p-4 space-y-3">
                                        <h3 className="font-bold text-[#4a3b2c] text-sm">🗂️ จัดการหมวดหมู่สินค้า</h3>
                                        <form onSubmit={handleAddCategory} className="flex gap-2">
                                            <input
                                                type="text"
                                                value={newCatName}
                                                onChange={e => setNewCatName(e.target.value)}
                                                placeholder="ชื่อหมวดหมู่ใหม่ (เช่น อาหารสัตว์, แร่)"
                                                className="flex-1 bg-[#fafdf7] border border-[#dce8ce] rounded-full px-4 py-2 text-xs font-medium outline-none"
                                            />
                                            <button type="submit" className="btn-pink-3d px-5 py-2 text-xs font-bold">
                                                + เพิ่มหมวดหมู่
                                            </button>
                                        </form>

                                        <div className="flex flex-wrap gap-2 pt-1">
                                            {categories.map(c => (
                                                <div key={c.id} className="bg-[#f7fbf2] border border-[#dce8ce] px-3.5 py-1.5 rounded-full flex items-center gap-2 text-xs font-bold text-[#4a3b2c]">
                                                    <span>{c.label}</span>
                                                    {c.id !== 'ทั้งหมด' && (
                                                        <button
                                                            onClick={() => handleDeleteCategory(c.id)}
                                                            className="text-rose-500 hover:text-rose-700 font-extrabold"
                                                        >
                                                            ✕
                                                        </button>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* TAB 4: BRANDING, LOGO, BANNER & PNG ASSETS */}
                                {adminTab === 'branding' && (
                                    <div className="card-pastel p-4 space-y-3">
                                        <h3 className="font-bold text-[#4a3b2c] text-sm">🎨 ตั้งค่าโลโก้ แบนเนอร์ และรูป PNG</h3>
                                        <div className="space-y-2.5 text-xs">
                                            <div>
                                                <label className="block font-bold text-[#556b2f] mb-1">ชื่อร้านค้า</label>
                                                <input
                                                    type="text"
                                                    value={branding.storeName}
                                                    onChange={e => setBranding({ ...branding, storeName: e.target.value })}
                                                    className="w-full bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-3 py-2 font-bold text-[#4a3b2c] outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-[#556b2f] mb-1">ลิงก์รูปโลโก้ร้าน (แถบบนซ้าย)</label>
                                                <input
                                                    type="url"
                                                    value={branding.logoUrl}
                                                    onChange={e => setBranding({ ...branding, logoUrl: e.target.value })}
                                                    className="w-full bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-3 py-2 text-[#4a3b2c] outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-[#556b2f] mb-1">ลิงก์รูปปุ่มตะกร้า PNG ลอย (ฝั่งขวา)</label>
                                                <input
                                                    type="url"
                                                    value={branding.cartPngUrl}
                                                    onChange={e => setBranding({ ...branding, cartPngUrl: e.target.value })}
                                                    className="w-full bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-3 py-2 text-[#4a3b2c] outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-[#556b2f] mb-1">ลิงก์รูปแผ่นเสียงเพลง PNG หมุน (แถบบนขวา)</label>
                                                <input
                                                    type="url"
                                                    value={branding.vinylPngUrl}
                                                    onChange={e => setBranding({ ...branding, vinylPngUrl: e.target.value })}
                                                    className="w-full bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-3 py-2 text-[#4a3b2c] outline-none"
                                                />
                                            </div>
                                            <div>
                                                <label className="block font-bold text-[#556b2f] mb-1">ลิงก์รูปแบนเนอร์หัวเว็บ (เว้นว่างเพื่อใช้ฉากฟาร์ม Hay Day พาสเทล)</label>
                                                <input
                                                    type="url"
                                                    value={branding.bannerUrl}
                                                    onChange={e => setBranding({ ...branding, bannerUrl: e.target.value })}
                                                    placeholder="https://..."
                                                    className="w-full bg-[#fafdf7] border border-[#dce8ce] rounded-xl px-3 py-2 text-[#4a3b2c] outline-none"
                                                />
                                            </div>
                                        </div>
                                        <button
                                            onClick={() => showToast('อัปเดตการตั้งค่าโลโก้และแบนเนอร์เรียบร้อย')}
                                            className="btn-pink-3d px-6 py-2 text-xs font-bold"
                                        >
                                            ✅ บันทึกการแสดงผล
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
