<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เฮเดย์ฟาร์ม (Hay Day Farm Pastel)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Kanit & Mali for cute smooth rounded Thai typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&family=Mali:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tone.js for gentle background melody when vinyl spins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #ebf7ff 0%, #f5fbe8 45%, #fffdf7 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        /* Full-screen across all devices (Mobile, iPad, Desktop) in Hay Day Pastel palette */
        .app-wrapper {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            background: linear-gradient(180deg, #eaf6ff 0%, #f4fae9 38%, #fffdf7 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .content-container {
            width: 100%;
            max-width: 1180px;
            margin: 0 auto;
        }

        /* Minimalist Pastel Hay Day Primary Button (Warm Strawberry-Barn Red Pastel) */
        .btn-pink-3d {
            background: linear-gradient(180deg, #f6838d 0%, #e55b69 100%);
            border: 1px solid #f9b4bb;
            box-shadow: 0 4px 12px rgba(229, 91, 105, 0.22);
            color: #ffffff;
            border-radius: 9999px;
            transition: all 0.16s ease;
        }
        .btn-pink-3d:active {
            transform: scale(0.98);
            box-shadow: 0 2px 6px rgba(229, 91, 105, 0.25);
        }

        /* Minimalist Pastel Card & Squish-Bounce Animation */
        .card-pastel {
            background: #ffffff;
            border: 1px solid #e4edd8;
            box-shadow: 0 4px 14px rgba(108, 134, 82, 0.07);
            border-radius: 20px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card-pastel:hover {
            border-color: #b8d896;
        }

        @keyframes cardSquishBounce {
            0% { transform: scale(1); }
            35% { transform: scale(0.88, 0.86) translateY(3px); }
            70% { transform: scale(1.04, 1.05) translateY(-2px); }
            88% { transform: scale(0.98, 0.98); }
            100% { transform: scale(1); }
        }
        .card-squish-anim {
            animation: cardSquishBounce 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Vinyl Record Spin & Floating Music Notes */
        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .vinyl-spinning {
            animation: spinVinyl 6s linear infinite;
        }
        .vinyl-paused {
            animation: spinVinyl 6s linear infinite;
            animation-play-state: paused;
        }

        @keyframes floatMusicNote1 {
            0% { transform: translate(0, 0) scale(0.6) rotate(-10deg); opacity: 0; }
            25% { opacity: 0.95; }
            100% { transform: translate(-22px, -34px) scale(1.15) rotate(-25deg); opacity: 0; }
        }
        @keyframes floatMusicNote2 {
            0% { transform: translate(0, 0) scale(0.6) rotate(8deg); opacity: 0; }
            25% { opacity: 0.95; }
            100% { transform: translate(18px, -38px) scale(1.1) rotate(22deg); opacity: 0; }
        }
        @keyframes floatMusicNote3 {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 0; }
            30% { opacity: 0.9; }
            100% { transform: translate(-4px, -42px) scale(1.05) rotate(14deg); opacity: 0; }
        }
        .music-note-1 { animation: floatMusicNote1 2.4s ease-out infinite; }
        .music-note-2 { animation: floatMusicNote2 2.8s ease-out infinite 0.7s; }
        .music-note-3 { animation: floatMusicNote3 2.5s ease-out infinite 1.4s; }

        /* Floating Cart PNG Bobbing & Pop Effect */
        @keyframes cartGentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        .floating-cart-btn {
            animation: cartGentleFloat 3.2s ease-in-out infinite;
        }
        @keyframes bubblePopIn {
            0% { opacity: 0; transform: scale(0.88) translateX(10px); }
            65% { opacity: 1; transform: scale(1.02) translateX(0); }
            100% { opacity: 1; transform: scale(1) translateX(0); }
        }
        .cart-bubble-pop {
            animation: bubblePopIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Minimalist Category Tab Buttons (Pastel Grass Green Active) */
        .tab-active {
            background: linear-gradient(180deg, #86cf58 0%, #68b43c 100%);
            border: 1px solid #a7e082;
            box-shadow: 0 3px 10px rgba(104, 180, 60, 0.22);
            color: white;
            border-radius: 16px;
        }
        .tab-inactive {
            background: #ffffff;
            border: 1px solid #e2ecd5;
            box-shadow: 0 2px 6px rgba(108, 134, 82, 0.05);
            color: #556b2f;
            border-radius: 16px;
        }
        .tab-inactive:active, .tab-active:active {
            transform: scale(0.97);
        }

        /* Minimalist Navigation Header Bar */
        .nav-pill {
            background: #ffffff;
            border: 1px solid #e2ecd5;
            box-shadow: 0 3px 10px rgba(108, 134, 82, 0.06);
            border-radius: 9999px;
        }

        /* Minimalist Minus & Plus Round Buttons */
        .btn-circle-minus {
            background: #f5727e;
            border: 1px solid #f9a5ad;
            box-shadow: 0 2px 6px rgba(245, 114, 126, 0.22);
            color: white;
        }
        .btn-circle-minus:active { transform: scale(0.94); }

        .btn-circle-plus {
            background: #6dc245;
            border: 1px solid #9ce07b;
            box-shadow: 0 2px 6px rgba(109, 194, 69, 0.22);
            color: white;
        }
        .btn-circle-plus:active { transform: scale(0.94); }

        /* Title text stroke effect like Hay Day UI */
        .title-stroke {
            font-family: 'Mali', cursive;
            color: #8c4a1c;
            text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, -1.5px 1.5px 0 #fff, 1.5px 1.5px 0 #fff, 0px 2px 4px rgba(140, 74, 28, 0.18);
        }

        /* Animations */
        @keyframes windmillSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .windmill-blades {
            transform-origin: 78px 62px;
            animation: windmillSpin 18s linear infinite;
        }

        @keyframes sheepBob {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(1deg); }
        }
        .sheep-mascot {
            animation: sheepBob 3.5s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // 1. CUSTOM SVG & 1:1 IMAGE ITEM ILLUSTRATIONS
        // ==========================================
        const ItemIllustration = ({ type, imageUrl = '', size = "w-16 h-16" }) => {

                return (
                    <img

            }
            switch (type) {
                case 'plank':
                    return (
                        <svg viewBox="0 0 100 85" className={size}>

                            </defs>

                            <polygon points="18,52 34,65 34,74 18,61" fill="#b36d28" stroke="#8c4f14" strokeWidth="2" strokeLinejoin="round"/>

                            <polygon points="26,54 84,23 84,33 26,64" fill="url(#woodSide)" stroke="#8c4f14" strokeWidth="2" strokeLinejoin="round"/>
                            <path d="M25,40 Q45,28 68,18 M35,45 Q55,34 74,24" stroke="#b8762e" strokeWidth="1.5" fill="none" strokeLinecap="round"/>

                case 'tape':
                    return (

                            <path d="M16,36 C16,50 16,54 16,56 C16,67 30,74 46,74 C62,74 76,67 76,56 L76,36 Z" fill="url(#tapePink)" stroke="#d84b7a" strokeWidth="2" strokeLinejoin="round"/>
                            <ellipse cx="46" cy="36" rx="30" ry="15" fill="url(#tapeTop)" stroke="#d84b7a" strokeWidth="2"/>

                            <polygon points="56,14 74,12 84,26 76,42 58,44 48,30" fill="#e2e8f0" stroke="#64748b" strokeWidth="2" strokeLinejoin="round"/>

                case 'nail':

                                <ellipse cx="30" cy="19" rx="9" ry="4" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                            </g>
                            <g transform="rotate(15 52 42)">
                                <path d="M47,14 L53,14 L51,64 L49,73 L47,64 Z" fill="#e2e8f0" stroke="#64748b" strokeWidth="2" strokeLinejoin="round"/>
                                <ellipse cx="50" cy="13" rx="10" ry="4.5" fill="#f1f5f9" stroke="#64748b" strokeWidth="2"/>
                            </g>
                            <g transform="rotate(42 66 52)">
                                <path d="M62,22 L68,22 L66,68 L64,76 L62,68 Z" fill="#cbd5e1" stroke="#64748b" strokeWidth="2" strokeLinejoin="round"/>
                                <ellipse cx="65" cy="21" rx="9" ry="4" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                            </g>
                        </svg>
                    );
                case 'screw':
                    return (
                        <svg viewBox="0 0 100 85" className={size}>
                            <g transform="rotate(-22 46 34)">
                                <polygon points="10,35 55,28 55,42" fill="#cbd5e1" stroke="#64748b" strokeWidth="2" strokeLinejoin="round"/>
                                <path d="M22,31 L20,39 M30,30 L28,40 M38,29 L36,41 M46,28 L44,42" stroke="#475569" strokeWidth="2.5" strokeLinecap="round"/>
                                <ellipse cx="58" cy="35" rx="7" ry="13" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                <path d="M56,29 L60,41 M54,36 L62,34" stroke="#64748b" strokeWidth="2.5" strokeLinecap="round"/>
                            </g>
                            <g transform="rotate(-12 60 58)">
                                <polygon points="24,60 69,53 69,67" fill="#e2e8f0" stroke="#64748b" strokeWidth="2" strokeLinejoin="round"/>
                                <path d="M36,56 L34,64 M44,55 L42,65 M52,54 L50,66 M60,53 L58,67" stroke="#475569" strokeWidth="2.5" strokeLinecap="round"/>
                                <ellipse cx="72" cy="60" rx="7" ry="13" fill="#f1f5f9" stroke="#64748b" strokeWidth="2"/>
                                <path d="M70,54 L74,66 M68,61 L76,59" stroke="#64748b" strokeWidth="2.5" strokeLinecap="round"/>
                            </g>
                        </svg>
                    );
                case 'panel':
                    return (
                        <svg viewBox="0 0 100 85" className={size}>
                            <polygon points="10,48 64,24 92,40 38,66" fill="#e6a95c" stroke="#8c4f14" strokeWidth="2" strokeLinejoin="round"/>
                            <polygon points="10,48 38,66 38,74 10,56" fill="#b36d28" stroke="#8c4f14" strokeWidth="2" strokeLinejoin="round"/>

                            <polygon points="38,54 90,28 90,36 38,62" fill="#d99041" stroke="#8c4f14" strokeWidth="2" strokeLinejoin="round"/>
                            <line x1="26" y1="45" x2="78" y2="20" stroke="#b8762e" strokeWidth="1.8"/>
                        </svg>
                    );
                case 'deed':
                    return (
                        <svg viewBox="0 0 100 85" className={size}>
                            <g transform="rotate(-8 50 42)">
                                <rect x="20" y="8" width="58" height="68" rx="4" fill="#fff7e6" stroke="#b58858" strokeWidth="2"/>
                                <rect x="24" y="12" width="50" height="60" rx="2" fill="none" stroke="#dec096" strokeWidth="1.5"/>
                                <path d="M44,18 C46,14 52,14 54,18 C57,16 59,20 55,23 L49,27 L43,23 C39,20 41,16 44,18 Z" fill="#e05353"/>
                                <line x1="32" y1="32" x2="66" y2="32" stroke="#c9a981" strokeWidth="2" strokeLinecap="round"/>
                                <line x1="36" y1="38" x2="62" y2="38" stroke="#c9a981" strokeWidth="2" strokeLinecap="round"/>
                                <polygon points="36,46 58,44 64,56 32,58" fill="#b4e376" stroke="#6fa832" strokeWidth="1.8" strokeLinejoin="round"/>
                                <line x1="47" y1="45" x2="48" y2="57" stroke="#6fa832" strokeWidth="1.5"/>
                                <line x1="34" y1="52" x2="61" y2="50" stroke="#6fa832" strokeWidth="1.5"/>
                                <circle cx="64" cy="62" r="7" fill="#f2748c" stroke="#c93b56" strokeWidth="1.8"/>
                                <circle cx="64" cy="62" r="4" fill="none" stroke="#ffdbe2" strokeWidth="1"/>
                            </g>
                        </svg>
                    );
                case 'hammer':
                    return (
                        <svg viewBox="0 0 100 85" className={size}>
                            <path d="M44,32 L72,68 C75,72 67,78 63,73 L36,38 Z" fill="#f3be7a" stroke="#8c5319" strokeWidth="2" strokeLinejoin="round"/>

                            <line x1="49" y1="53" x2="57" y2="48" stroke="#ff9ec0" strokeWidth="2" strokeLinecap="round"/>
                            <line x1="55" y1="60" x2="63" y2="55" stroke="#ff9ec0" strokeWidth="2" strokeLinecap="round"/>
                            <line x1="61" y1="67" x2="69" y2="62" stroke="#ff9ec0" strokeWidth="2" strokeLinecap="round"/>
                            <path d="M22,28 C28,18 42,14 58,18 C52,22 48,25 46,30 L34,42 C30,45 20,35 22,28 Z" fill="#cbd5e1" stroke="#64748b" strokeWidth="2" strokeLinejoin="round"/>
                            <ellipse cx="26" cy="36" rx="7" ry="9" transform="rotate(-35 26 36)" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                        </svg>
                    );
                case 'stake':
                    return (
                        <svg viewBox="0 0 100 85" className={size}>
                            <path d="M24,68 Q20,58 30,62 Q35,52 44,60 Q52,50 58,60 Q68,54 72,64 Q80,62 76,70 Z" fill="#95d654" stroke="#5c9e23" strokeWidth="2" strokeLinejoin="round"/>
                            <path d="M52,22 C64,20 74,25 84,22 L72,34 L82,42 C70,45 62,40 50,42 Z" fill="#f76898" stroke="#be295b" strokeWidth="2" strokeLinejoin="round"/>
                            <polygon points="42,14 54,14 51,64 45,70 40,64" fill="#eab368" stroke="#8c5319" strokeWidth="2" strokeLinejoin="round"/>
                            <ellipse cx="48" cy="14" rx="6" ry="3" fill="#f7d59c" stroke="#8c5319" strokeWidth="2"/>
                        </svg>
                    );
                default:
                    return null;
            }
        };

        // ==========================================
        // 2. HEADER BANNER ILLUSTRATION (Hay Day Pastel Theme)
        // ==========================================
        const HayDayPastelHeader = ({ mode = "store", storeName = "เฮเดย์ฟาร์ม", bannerUrl = "" }) => {
            if (bannerUrl && bannerUrl.trim() !== '') {
                return (
                    <div className="relative w-full overflow-hidden select-none pt-1 pb-2 px-3">
                        <img
                            src={bannerUrl.trim()}
                            alt={storeName}
                            className="w-full max-h-44 object-cover rounded-2xl border border-[#dce8ce] shadow-sm"
                        />
                    </div>
                );
            }
            return (
                <div className="relative w-full overflow-hidden select-none pt-1 pb-2">
                    <svg viewBox="0 0 460 158" className="w-full h-auto">
                        <defs>
                            <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#d9f0a3"/>
                                <stop offset="100%" stopColor="#b8df72"/>
                            </linearGradient>
                            <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#c5e884"/>
                                <stop offset="100%" stopColor="#9cd154"/>
                            </linearGradient>
                            <linearGradient id="signBoard" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#fffef8"/>
                                <stop offset="100%" stopColor="#fdf3dc"/>
                            </linearGradient>
                            <linearGradient id="ribbonHayDay" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#f57884"/>
                                <stop offset="100%" stopColor="#e35664"/>
                            </linearGradient>
                        </defs>

                        {/* Soft Clouds */}
                        <ellipse cx="65" cy="45" rx="45" ry="22" fill="#ffffff" opacity="0.75"/>
                        <ellipse cx="390" cy="40" rx="55" ry="25" fill="#ffffff" opacity="0.75"/>
                        <ellipse cx="230" cy="25" rx="70" ry="22" fill="#ffffff" opacity="0.65"/>

                        {/* Green Rolling Hills & Trees */}
                        <circle cx="35" cy="98" r="26" fill="#b7e278"/>
                        <circle cx="65" cy="102" r="22" fill="#c7eb8e"/>
                        <circle cx="345" cy="98" r="24" fill="#b7e278"/>
                        <circle cx="430" cy="95" r="28" fill="#b7e278"/>
                        <path d="M-10,125 Q90,85 210,120 T470,115 L470,158 L-10,158 Z" fill="url(#hillBack)"/>

                        {/* White Cream Wooden Fence Left & Right */}
                        <g stroke="#d5c4a8" strokeWidth="1.2" fill="#fffdf7">
                            <rect x="8" y="106" width="10" height="32" rx="3"/>
                            <rect x="26" y="106" width="10" height="32" rx="3"/>
                            <rect x="44" y="106" width="10" height="32" rx="3"/>
                            <rect x="62" y="106" width="10" height="32" rx="3"/>
                            <rect x="4" y="114" width="74" height="6" rx="2"/>
                            <rect x="4" y="126" width="74" height="6" rx="2"/>

                            <rect x="388" y="106" width="10" height="32" rx="3"/>

            const clean = name.trim();
            if (!clean) return 'HF';
            // Known Thai-to-English smart mapping + general Thai consonant initials
            if (clean.includes('เฮเดย์')) return 'HD';
            const thaiToEngMap = {
                'ก': 'K', 'ข': 'K', 'ค': 'K', 'ฆ': 'K', 'ง': 'N',
                'จ': 'J', 'ฉ': 'C', 'ช': 'C', 'ซ': 'S', 'ฌ': 'C', 'ญ': 'Y',
                'ฎ': 'D', 'ฏ': 'T', 'ฐ': 'T', 'ฑ': 'T', 'ฒ': 'T', 'ณ': 'N',

            };
            const words = clean.split(/\s+/);
            if (words.length >= 2) {
                const letters = words.slice(0, 2).map(w => {
                    const ch = w.replace(/[^A-Za-zก-ฮ]/g, '')[0] || '';
                    return /[A-Za-z]/.test(ch) ? ch.toUpperCase() : (thaiToEngMap[ch] || 'F');

            // Cart Calculations
            const totalItemsCount = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalCartPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const handleAddProduct = (product) => {
                setBouncingId(product.id);
                setTimeout(() => {
                    setBouncingId(prev => (prev === product.id ? null : prev));
                }, 440);

                try {
                    if (window.Tone && Tone.context.state === 'running') {
                        const popSynth = new Tone.Synth({
                            oscillator: { type: "triangle" },
                            envelope: { attack: 0.005, decay: 0.09, sustain: 0, release: 0.09 }
                        }).toDestination();
                        popSynth.volume.value = -14;
                        popSynth.triggerAttackRelease("G5", "32n");
                    }
                } catch (e) {}

                setCart(prev => {
                    const found = prev.find(i => i.id === product.id);
                    let updated;
                    if (found) {
                        updated = prev.map(i => i.id === product.id ? { ...i, qty: i.qty + 1 } : i);
                    } else {
                        updated = [...prev, { ...product, qty: 1 }];
                    }

                    const newTotalQty = updated.reduce((s, i) => s + i.qty, 0);
                    const newTotalPrice = updated.reduce((s, i) => s + i.price * i.qty, 0);

                    setCartNotice({
                        lastAddedName: product.name,
                        itemsSummary: updated.map(i => `${i.name} ×${i.qty}`).join(', '),
                        totalQty: newTotalQty,
                        totalPrice: newTotalPrice
                    });
                    setIsNoticeExpanded(true);

                    return updated;
                });
            };

            const handleUpdateQty = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const nextQty = item.qty + delta;
                        return nextQty > 0 ? { ...item, qty: nextQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const handleConfirmOrder = () => {
                const cleanTag = receiveTag.trim() ? (receiveTag.trim().startsWith('#') ? receiveTag.trim() : `#${receiveTag.trim()}`) : '#L123';
                const prefix = getStorePrefix(branding.storeName);
                const randomCode = prefix + Math.floor(10000 + Math.random() * 90000);
                const newOrder = {
                    code: randomCode,
                    tag: cleanTag,
                    items: cart.map(item => ({ ...item, itemStatus: 'pending' })),
                    totalQty: totalItemsCount,
                    totalPrice: totalCartPrice,
                    status: 'รอจัดส่ง',
                    isDemoSample: false,
                    createdAt: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
                };
                setOrders(prev => [newOrder, ...prev]);
                setActiveOrderCode(newOrder.code);
                setScreen('success');
                showToast('สร้างคำสั่งซื้อสำเร็จ! (โหมด Demo)');
            };

            const handleDeleteOrder = (orderCode) => {
                setOrders(prev => {
                    const remaining = prev.filter(o => o.code !== orderCode);
                    if (activeOrderCode === orderCode) {
                        if (remaining.length > 0) {
                            setActiveOrderCode(remaining[0].code);
                        } else {
                            setActiveOrderCode(null);
                            if (screen === 'details' || screen === 'success') {
                                setScreen('store');
                            }
                        }
                    }
                    return remaining;
                });
                showToast(`ลบออเดอร์ ${orderCode} เรียบร้อยแล้ว`);
            };

            const copyText = (text, label) => {
                const el = document.createElement('textarea');
                el.value = text;
                document.body.appendChild(el);
                el.select();
                try {
                    document.execCommand('copy');
                    showToast(`คัดลอก${label}เรียบร้อยแล้ว`);
                } catch (e) {
                    showToast('คัดลอกสำเร็จ');
                }
                document.body.removeChild(el);
            };

            // Tap-to-cycle item fulfillment status in Admin:
            // pending -> sent (1 tap: เขียว ส่งแล้ว) -> waiting (2 taps: เหลือง รอลูกค้ารับของ) -> out (3 taps: แดง ของหมด) -> pending
            const cycleOrderItemStatus = (orderCode, itemId) => {
                const statusCycle = ['pending', 'sent', 'waiting', 'out'];
                const statusLabels = {
                    pending: 'ยังไม่ระบุ',
                    sent: 'สีเขียว: ส่งแล้ว',
                    waiting: 'สีเหลือง: รอลูกค้ารับของ',
                    out: 'สีแดง: ของหมด'
                };

                setOrders(prev => prev.map(order => {
                    if (order.code !== orderCode) return order;
                    let nextLabel = '';
                    const updatedItems = order.items.map(item => {
                        if (item.id !== itemId) return item;
                        const currIdx = statusCycle.indexOf(item.itemStatus || 'pending');
                        const nextStatus = statusCycle[(currIdx + 1) % statusCycle.length];
                        nextLabel = statusLabels[nextStatus];
                        return { ...item, itemStatus: nextStatus };
                    });
                    if (nextLabel) showToast(`เปลี่ยนสถานะเป็น ${nextLabel}`);
                    return { ...order, items: updatedItems };
                }));
            };

            // Admin Product CRUD
            const handleSaveProduct = (e) => {
                e.preventDefault();
                if (!newProdForm.name.trim()) return;
                if (editingProdId) {
                    setProducts(prev => prev.map(p => p.id === editingProdId ? { ...p, ...newProdForm, level: Number(newProdForm.level) || 1, price: Number(newProdForm.price) || 0 } : p));
                    setEditingProdId(null);
                    showToast('แก้ไขข้อมูลสินค้าเรียบร้อย');
                } else {
                    const created = {
                        ...newProdForm,
                        id: Date.now(),
                        level: Number(newProdForm.level) || 1,
                        price: Number(newProdForm.price) || 0
                    };
                    setProducts(prev => [...prev, created]);
                    showToast('เพิ่มสินค้าใหม่เรียบร้อย');
                }
                setNewProdForm({ name: '', desc: '', level: 7, price: 5, category: categories[1]?.id || 'โรงนา', svgType: 'plank', imageUrl: '' });
            };

            const handleDeleteProduct = (id) => {
                setProducts(prev => prev.filter(p => p.id !== id));
                showToast('ลบสินค้าเรียบร้อย');
            };

            // Admin Category CRUD
            const handleAddCategory = (e) => {
                e.preventDefault();
                const trimmed = newCatName.trim();
                if (!trimmed) return;
                if (categories.some(c => c.id === trimmed)) {
                    showToast('มีหมวดหมู่นี้อยู่แล้ว');
                    return;
                }
                setCategories(prev => [...prev, { id: trimmed, label: trimmed, iconType: 'custom' }]);
                setNewCatName('');
                showToast(`เพิ่มหมวดหมู่ "${trimmed}" แล้ว`);
            };

            const handleDeleteCategory = (id) => {
                if (id === 'ทั้งหมด') return;
                setCategories(prev => prev.filter(c => c.id !== id));
                if (selectedCat === id) setSelectedCat('ทั้งหมด');
                showToast(`ลบหมวดหมู่ "${id}" แล้ว`);
            };

            // Filter products with separated Product Name search and Level filter
            const filteredProducts = products.filter(p => {
                const matchCat = selectedCat === 'ทั้งหมด' || p.category === selectedCat;
                const nameQ = searchName.trim().toLowerCase();
                const levelQ = searchLevel.trim().replace(/[^0-9]/g, '');

                const matchName = !nameQ || p.name.toLowerCase().includes(nameQ) || p.desc.toLowerCase().includes(nameQ);
                const matchLevel = !levelQ || String(p.level).includes(levelQ);

                return matchCat && matchName && matchLevel;
            });

            // Render Category Icon Helper
            const renderCategoryIcon = (iconType) => {
                switch (iconType) {
                    case 'all':
                        return (
                            <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
                                <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
                                <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
                            </svg>
                        );
                    case 'barn':
                        return (
                            <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinejoin="round">
                                <path d="M3 10L12 3l9 7v10a1 1 0 01-1 1H4a1 1 0 01-1-1V10z"/>
                                <path d="M9 21V13h6v8M9 13l6 8M15 13l-6 8"/>
                            </svg>
                        );
                    case 'silo':
                        return (
                            <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2">
                                <path d="M6 10a6 6 0 0112 0v10H6V10z"/>
                                <path d="M6 14h12M6 18h12M4 20h16"/>
                            </svg>
                        );
                    case 'land':
                        return (
                            <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                <path d="M4 6v14M12 6v14M20 6v14M2 10h20M2 16h20"/>
                            </svg>
                        );
                    default:
                        return <span className="text-base leading-none">🌾</span>;
                }
            };

            // Build neat, well-structured order copy text including website/store name, items, tag, and polite waiting note
            const formatOrderCopyText = (order) => {
                if (!order) return '';
                const lines = order.items.map((i, idx) => `  ${idx + 1}. ${i.name} ×${i.qty} = ฿${i.price * i.qty}`).join('\n');
                return [
                    `🌾 สั่งซื้อจากเว็บ: ${branding.storeName}`,
                    `🧾 โค้ดออเดอร์: ${order.code}`,
                    `🏷️ แท็กรับของ: ${order.tag}`,
                    `━━━━━━━━━━━━━━`,
                    `📦 รายการสินค้า:`,
                    lines,
                    `━━━━━━━━━━━━━━`,
                    `💰 ยอดรวมทั้งหมด: ${order.totalQty} ชิ้น (฿${order.totalPrice})`,
                    ``,
                    `✨ คัดลอกออเดอร์ส่งให้ร้านเรียบร้อยแล้ว กรุณารออย่างใจเย็นไม่ดันแชทนะคะ 🙏`
                ].join('\n');
            };

            return (
                <div className="app-wrapper">
                    {/* Floating Toast Alert */}
                    {toast && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-[#556b2f] text-white px-5 py-2 rounded-full shadow-lg border border-[#b8d896] text-xs font-semibold flex items-center gap-2">
                            <span>🌾</span> {toast}
                        </div>
                    )}

                    {/* Top Brand Tab Bar with Logo (Tap Logo to enter Admin), Store Name & Spinning Vinyl Record */}
                    <TopBrandMusicBar
                        isPlaying={isMusicPlaying}
                        onToggleMusic={toggleMusic}
                        storeName={branding.storeName}
                        logoUrl={branding.logoUrl}
                        vinylUrl={branding.vinylPngUrl}
                        onLogoClick={() => setScreen(prev => (prev === 'admin' ? 'store' : 'admin'))}
                    />

                    {/* Floating Right-Side Transparent PNG Cart Button (No circle frame, larger size, auto-minimizing alert) */}
                    <div className="fixed right-3 md:right-6 bottom-24 md:bottom-28 z-40 flex flex-col items-end gap-1.5 pointer-events-none">
                        {/* Stage 1: Full Notification Bubble (Shows for ~2.5s when item picked) */}
                        {cartNotice && isNoticeExpanded && (
                            <div
                                key={`${cartNotice.lastAddedName}-${cartNotice.totalQty}`}
                                className="cart-bubble-pop pointer-events-auto max-w-[235px] sm:max-w-[265px] bg-white/95 backdrop-blur-md border border-[#cde3b4] rounded-2xl p-2.5 shadow-lg text-left relative"
                            >
                                <button
                                    onClick={() => setIsNoticeExpanded(false)}
                                    className="absolute top-1.5 right-2 text-[11px] text-[#7a8f62] hover:text-[#4b6b28] font-bold"
                                    aria-label="ย่อแจ้งเตือน"
                                >
                                    ✕
                                </button>
                                <div className="text-[11px] font-bold text-[#4b7c22] mb-1 pr-4">
                                    ✨ เพิ่ม: {cartNotice.lastAddedName}
                                </div>
                                <p className="text-[11px] text-[#556b2f] font-medium line-clamp-2 leading-snug bg-[#f7fbf2] px-2 py-1 rounded-xl border border-[#e7f1dc]">
                                    {cartNotice.itemsSummary}
                                </p>
                                <div className="mt-1.5 pt-1.5 border-t border-[#ebf3e1] flex items-center justify-between">
                                    <span className="text-[11px] font-semibold text-[#556b2f]">
                                        รวม {cartNotice.totalQty} ชิ้น • <strong className="text-[#e55b69]">฿{cartNotice.totalPrice}</strong>
                                    </span>
                                    <button
                                        onClick={() => {
                                            setIsNoticeExpanded(false);
                                            setScreen('cart');
                                        }}
                                        className="text-[11px] font-bold bg-[#68b43c] text-white px-2.5 py-0.5 rounded-full active:scale-95"
                                    >
                                        ดูสรุป →
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* Stage 2: Compact Cute Summary Pill (Shown after ~2.5s or whenever items exist in cart) */}
                        {(!isNoticeExpanded && totalItemsCount > 0) && (
                            <button
                                onClick={() => setScreen('cart')}
                                className="pointer-events-auto bg-white/95 backdrop-blur-sm border border-[#cde3b4] text-[#4a3b2c] px-3 py-1 rounded-full shadow-md flex items-center gap-1.5 text-[11px] font-bold hover:scale-105 active:scale-95 transition-transform"
                            >
                                <span>🧺 {totalItemsCount} ชิ้น</span>
                                <span className="text-[#cde3b4]">•</span>
                                <span className="text-[#e55b69] font-extrabold">฿{totalCartPrice}</span>
                            </button>
                        )}

                        {/* Transparent Enlarged Custom PNG Cart Button (No Circle Frame) */}
                        <button
                            onClick={() => setScreen('cart')}
                            className="floating-cart-btn pointer-events-auto relative group bg-transparent border-0 p-0 focus:outline-none"
                            aria-label="เปิดตะกร้าสรุปรายการสินค้า"
                        >
                            <img
                                src={branding.cartPngUrl}
                                alt="ตะกร้าสินค้า"
                                className="w-24 h-24 md:w-28 md:h-28 object-contain drop-shadow-[0_6px_12px_rgba(92,115,64,0.28)] group-hover:scale-105 group-active:scale-90 transition-transform"
                                onError={(e) => {
                                    e.target.src = "https://placehold.co/112x112/86cf58/ffffff?text=Cart";
                                }}
                            />

                            {/* Minimal Item Count Badge */}
                            <div className="absolute top-1 right-1 bg-[#e55b69] text-white text-[11px] font-bold min-w-[22px] h-[22px] px-1 rounded-full flex items-center justify-center border border-white shadow-sm">
                                {totalItemsCount}
                            </div>
                        </button>
                    </div>

                    {/* ==========================================
                        SCREEN 1: STOREFRONT (Compact 1:1 Cards, No Bottom Red-Circled CTA Bar)
                       ========================================== */}
                    {screen === 'store' && (
                        <div className="flex flex-col flex-1 pb-12">
                            <div className="content-container">
                                <HayDayPastelHeader mode="store" storeName={branding.storeName} bannerUrl={branding.bannerUrl} />
                            </div>

                            <div className="content-container px-3.5 md:px-6 space-y-3">
                                {/* Category Buttons Row (Dynamic from Categories state) */}
                                <div className="grid grid-cols-4 gap-2 md:gap-3">
                                    {categories.map(tab => {
                                        const isActive = selectedCat === tab.id;
                                        return (
                                            <button
                                                key={tab.id}
                                                onClick={() => setSelectedCat(tab.id)}
                                                className={`py-2 px-2 flex flex-col sm:flex-row items-center justify-center gap-1 sm:gap-2 transition-all ${isActive ? 'tab-active' : 'tab-inactive'}`}
                                            >
                                                <div className={isActive ? 'text-white' : 'text-[#68b43c]'}>{renderCategoryIcon(tab.iconType)}</div>
                                                <span className="text-xs sm:text-sm md:text-base font-bold tracking-tight truncate max-w-full">{tab.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* Separated Search Inputs: 1. Product Name Search  2. Level Filter */}
                                <div className="grid grid-cols-12 gap-2">
                                    {/* Search by Product Name */}
                                    <div className="col-span-7 sm:col-span-8 bg-white rounded-full px-3.5 py-2 border border-[#dce8ce] shadow-sm flex items-center gap-2 focus-within:border-[#68b43c] transition-colors">
                                        <svg viewBox="0 0 24 24" className="w-4 h-4 text-[#68b43c] flex-shrink-0" fill="none" stroke="currentColor" strokeWidth="2.3">
                                            <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4" strokeLinecap="round"/>
                                        </svg>
                                        <input
                                            type="text"
                                            value={searchName}
                                            onChange={e => setSearchName(e.target.value)}
                                            placeholder="ค้นหาชื่อสินค้า..."
                                            className="w-full bg-transparent outline-none text-[#4a3b2c] placeholder-[#9ba88c] font-medium text-xs sm:text-sm"
                                        />
                                        {searchName && (
                                            <button onClick={() => setSearchName('')} className="text-xs text-[#8ea17a] hover:text-[#4b6b28] font-bold">✕</button>
                                        )}
                                    </div>

                                    {/* Filter by Level (Separated Input) */}
                                    <div className="col-span-5 sm:col-span-4 bg-white rounded-full px-3 py-2 border border-[#dce8ce] shadow-sm flex items-center gap-1.5 focus-within:border-[#68b43c] transition-colors">
                                        <span className="bg-[#eef8e3] text-[#4b7c22] text-[11px] font-bold px-2 py-0.5 rounded-full flex-shrink-0">
                                            เลเวล
                                        </span>
                                        <input
                                            type="number"
                                            min="1"
                                            value={searchLevel}
                                            onChange={e => setSearchLevel(e.target.value)}
                                            placeholder="กรอกเวล..."
                                            className="w-full bg-transparent outline-none text-[#4a3b2c] placeholder-[#9ba88c] font-semibold text-xs sm:text-sm"
                                        />
                                        {searchLevel && (
                                            <button onClick={() => setSearchLevel('')} className="text-xs text-[#8ea17a] hover:text-[#4b6b28] font-bold">✕</button>
                                        )}
                                    </div>
                                </div>

                                {/* Compact Product Grid with 1:1 Image Aspect Ratio */}
                                {filteredProducts.length === 0 ? (
                                    <div className="card-pastel p-8 text-center space-y-2">
                                        <p className="text-[#4a3b2c] font-bold text-sm">ไม่พบสินค้าที่ค้นหา</p>
                                        <button
                                            onClick={() => { setSearchName(''); setSearchLevel(''); setSelectedCat('ทั้งหมด'); }}
                                            className="text-xs font-bold text-[#68b43c] underline"
                                        >
                                            ล้างตัวกรองทั้งหมด
                                        </button>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2.5 md:gap-3.5 pt-0.5">
                                        {filteredProducts.map(item => {
                                            const inCart = cart.find(c => c.id === item.id);
                                            const isBouncing = bouncingId === item.id;
                                            return (
                                                <div
                                                    key={item.id}
                                                    onClick={() => handleAddProduct(item)}
                                                    className={`card-pastel p-2 md:p-3 flex flex-col items-center text-center relative cursor-pointer select-none ${isBouncing ? 'card-squish-anim' : ''}`}
                                                >
                                                    {/* Top-Right Level Badge (Pastel Straw-Gold) */}
                                                    <div className="absolute top-1.5 right-1.5 bg-[#f7c85c] text-[#5c3d08] text-[10px] font-bold px-2 py-0.5 rounded-full border border-[#ffe299] z-10">
                                                        เวล {item.level}
                                                    </div>

                                                    {/* Quantity badge if in cart */}
                                                    {inCart && (
                                                        <div className="absolute top-1.5 left-1.5 bg-[#68b43c] text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center shadow-sm border border-white z-10">
                                                            {inCart.qty}
                                                        </div>

                                                    {/* 1:1 Square Image Frame (Supports 1:1 images cleanly without tall cards) */}
                                                    <div className="w-full aspect-square max-w-[92px] md:max-w-[110px] mx-auto bg-gradient-to-b from-[#fafdf6] to-[#f1f8e8] rounded-2xl flex items-center justify-center mb-1.5 p-1.5 border border-[#e7f1dc]">
                                                        <ItemIllustration type={item.svgType} imageUrl={item.imageUrl} size="w-full h-full object-contain" />

                                                        ฿{item.price} / ชิ้น

                            </div>

                    {/* ==========================================
                        SCREEN 2: CART SUMMARY (Minimalist Hay Day Pastel)
                       ========================================== */}
                    {screen === 'cart' && (
                        <div className="flex flex-col flex-1">

                                <HayDayPastelHeader mode="sub" storeName={branding.storeName} bannerUrl={branding.bannerUrl} />
                            </div>

                            <div className="content-container max-w-2xl px-4 space-y-3 flex-1 pb-8">
                                {/* Top Navigation Bar */}
                                <div className="nav-pill px-3 py-2 flex items-center justify-between">
                                    <button
                                        onClick={() => setScreen('store')}
                                        className="w-8 h-8 rounded-full bg-[#f4fae9] border border-[#d6e8c2] flex items-center justify-center text-[#556b2f] font-bold text-base active:scale-95"
                                    >
                                        ❮
                                    </button>
                                    <div className="flex items-center gap-2 text-[#4a3b2c] font-extrabold text-lg">
                                        <svg viewBox="0 0 24 24" className="w-5 h-5 text-[#68b43c]" fill="none" stroke="currentColor" strokeWidth="2.2">
                                            <circle cx="9" cy="21" r="1.5"/><circle cx="19" cy="21" r="1.5"/>
                                            <path d="M2 3h3l2.6 12.4a2 2 0 002 1.6h9.8a2 2 0 002-1.6L23 7H6"/>
                                        </svg>
                                        <span>รวมยอดสินค้า</span>

                                        <p className="text-[#4a3b2c] font-bold text-base">ยังไม่มีสินค้าในตะกร้า</p>
                                        <button
